# Site: https://mantraroom.pages.dev on Cloudflare Pages. TEMPLATE cloudflare-pages.yml from
# MANTRA_MANIFEST/workflows. Runs when site/ changes or by hand. The download button opens the public repository's
# releases/latest (version-visible.md): the APK with the long element songs is over Pages' 25 MB per file.
# Secrets: CLOUDFLARE_API_TOKEN (Marko's paste), CLOUDFLARE_ACCOUNT_ID.
name: Site
on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/site.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The Pages project (made the first time, then it already exists)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create mantraroom --production-branch main || true
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=mantraroom --branch=main --commit-dirty=true
